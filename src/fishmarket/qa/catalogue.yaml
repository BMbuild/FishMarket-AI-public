# Question catalogue. Each entry: what it needs, which tool answers it, and how it is judged.
# kind: real_only | real_plus_fill | needs_fill_data.   data: noaa | gbif | both | fallback
- id: price_history
  category: Price history
  kind: real_only
  data: noaa
  tool: price_history
  needs_species: 1
  keywords: [price, prices, priced, fetch, fetched, worth, paid, pay, dockside, ex-vessel, per pound, sells for, sell for, cost per, value per]
  examples:
    - "What has Maine lobster fetched at the dock over 20 years?"
    - "What is the dockside price of {species}?"
    - "How much does {species} sell for per pound?"
    - "Show me the price history for {species}"
    - "What did {species} fetch in {region}?"
  caveats: Annual dockside prices only. Not wholesale or retail.
- id: price_vs_inflation
  category: Price vs inflation
  kind: real_only
  data: noaa
  tool: price_vs_inflation
  needs_species: 1
  strong: [inflation, cpi, inflation-adjusted]
  keywords: [inflation, adjusted, real terms, real price, cpi, purchasing power, really more expensive, just inflation, kept up with inflation, price rise is inflation]
  examples:
    - "Is {species} really more expensive or is it just inflation?"
    - "What is the inflation-adjusted price of {species}?"
    - "Has the price of {species} kept up with inflation?"
    - "{species} price in real terms"
    - "How much of the {species} price rise is inflation?"
  caveats: Uses annual US CPI-U for all items.
